name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: ORC test suites
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clojure

      # `project:orc` selects a project but leaves Polylith in its default
      # incremental mode, which can legitimately select zero tests on a clean
      # CI checkout. `:all-bricks` forces every test-bearing production brick
      # in the aggregate project to run exactly once in one classloader.
      - name: Run aggregate ORC project tests
        run: clojure -M:poly test project:orc :all-bricks

      # This brick currently belongs only to the development project. Polylith
      # accepts `test brick:predict-rlm-image-tools` but runs zero tests, so use
      # clojure.test directly and assert the execution count to prevent a false
      # green when discovery or project membership changes.
      - name: Run development-only brick tests
        run: |
          clojure -M:dev:test -e '
          (require (quote clojure.test)
                   (quote ai.obney.orc.predict-rlm-image-tools.interface-test))
          (let [result (clojure.test/run-tests
                        (quote ai.obney.orc.predict-rlm-image-tools.interface-test))]
            (when-not (= 4 (:test result))
              (throw (ex-info "Development-only test discovery count changed"
                              {:expected 4 :actual (:test result)})))
            (when-not (clojure.test/successful? result)
              (throw (ex-info "Development-only brick tests failed" result))))'

  live-llm-tests:
    name: Live LLM integration tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORC_INTEGRATION_TESTS: 'true'
      ORC_OPENROUTER_E2E_TESTS: 'true'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clojure

      - name: Require OpenRouter credential
        shell: bash
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "OPENROUTER_API_KEY must be configured as a GitHub Actions secret." >&2
            exit 1
          fi

      - name: Run and verify every live LLM test
        run: clojure -M:dev:test -m ai.obney.orc.live-test-runner
