name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-tests:
    name: ORC test suites
    runs-on: ubuntu-latest
    # The last completed aggregate took about 118 minutes. A later run
    # exceeded 120 minutes after 329 namespaces without assertion failures.
    # Keep the complete aggregate gate and allow the expanded suite to finish.
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clojure

      # LMDB-NATIVE-HARNESS-CRASH: colbert's tests run here, in their own
      # process, before the aggregate step below. Rationale and full dossier:
      # docs/build-timeline/issues/lmdb-native-harness-crash/. Short version —
      # colbert's LMDB-heavy suite sharing one JVM/classloader with the
      # evaluation brick's (also LMDB-backed) tests intermittently SIGSEGVs
      # the whole test JVM. A separate `run:` step is a separate JVM process,
      # which removes the adjacency without losing coverage (workspace.edn
      # excludes colbert from the `orc` project's test scope accordingly).
      - name: Run colbert brick tests (isolated JVM)
        run: clojure -M:poly test project:orc-colbert :all-bricks

      # `project:orc` selects a project but leaves Polylith in its default
      # incremental mode, which can legitimately select zero tests on a clean
      # CI checkout. `:all-bricks` forces every test-bearing production brick
      # in the aggregate project to run exactly once in one classloader.
      # (colbert excluded here — see workspace.edn and the step above.)
      - name: Run aggregate ORC project tests
        run: clojure -M:poly test project:orc :all-bricks

      # This brick currently belongs only to the development project. Polylith
      # accepts `test brick:predict-rlm-image-tools` but runs zero tests, so use
      # clojure.test directly and assert the execution count to prevent a false
      # green when discovery or project membership changes.
      - name: Run development-only brick tests
        run: |
          clojure -M:dev:test -e '
          (require (quote clojure.test)
                   (quote ai.obney.orc.predict-rlm-image-tools.interface-test))
          (let [result (clojure.test/run-tests
                        (quote ai.obney.orc.predict-rlm-image-tools.interface-test))]
            (when-not (= 4 (:test result))
              (throw (ex-info "Development-only test discovery count changed"
                              {:expected 4 :actual (:test result)})))
            (when-not (clojure.test/successful? result)
              (throw (ex-info "Development-only brick tests failed" result))))'

  gepa-cold-recovery-tests:
    name: GEPA cold recovery
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clojure

      # Each invocation is a new JVM. A shared persistent store must preserve
      # original work and metric identity without process-local registrations.
      - name: Verify recovery across process boundaries
        run: |
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test prepare "$RUNNER_TEMP/gepa-cold.edn"
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test recover "$RUNNER_TEMP/gepa-cold.edn"
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test prepare-custom "$RUNNER_TEMP/gepa-custom-cold.edn"
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test recover-custom "$RUNNER_TEMP/gepa-custom-cold.edn"
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test prepare-running "$RUNNER_TEMP/gepa-running-cold.edn"
          clojure -J-Xmx2g -M:dev:test -m ai.obney.orc.orc-service.gepa-cold-recovery-test recover-running "$RUNNER_TEMP/gepa-running-cold.edn"

  live-llm-tests:
    name: Live LLM integration tests
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORC_INTEGRATION_TESTS: 'true'
      ORC_OPENROUTER_E2E_TESTS: 'true'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-clojure

      - name: Require OpenRouter credential
        shell: bash
        run: |
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo "OPENROUTER_API_KEY must be configured as a GitHub Actions secret." >&2
            exit 1
          fi

      - name: Run and verify every live LLM test
        run: clojure -M:dev:test -m ai.obney.orc.live-test-runner
        env:
          ORC_LIVING_DESCRIPTION_EVIDENCE_DIR: ${{ runner.temp }}/orc-living-description-evidence
          ORC_GEPA_EVIDENCE_DIR: ${{ runner.temp }}/orc-gepa-evidence

      - name: Upload GEPA recovery diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orc-gepa-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orc-gepa-evidence
          if-no-files-found: warn

      - name: Upload living-description diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orc-living-description-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/orc-living-description-evidence
          if-no-files-found: warn
