name: Setup Clojure
description: Install Java 21, Clojure CLI, and restore dependency caches.

inputs:
  cli-version:
    description: Clojure CLI release to install and cache.
    default: '1.12.7.1681'

runs:
  using: composite
  steps:
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Clojure
      id: clojure
      continue-on-error: true
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: ${{ inputs.cli-version }}

    - name: Retry Clojure installation
      if: steps.clojure.outcome == 'failure'
      uses: DeLaGuardo/setup-clojure@13.7.0
      with:
        cli: ${{ inputs.cli-version }}

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.m2/repository
          ~/.gitlibs
        key: ${{ runner.os }}-clojure-${{ hashFiles('**/deps.edn') }}
        restore-keys: ${{ runner.os }}-clojure-

    - name: Prepare test dependencies
      shell: bash
      run: |
        for delay in 10 30; do
          if clojure -Sthreads 4 -P -M:dev:test; then
            exit 0
          fi
          echo "::warning::Dependency preparation failed. Retrying in ${delay}s."
          sleep "$delay"
        done
        clojure -Sthreads 4 -P -M:dev:test
